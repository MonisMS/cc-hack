[project]
name = "fieldproof-backend"
version = "0.1.0"
description = "FieldProof backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "fastembed>=0.8.1",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pgvector>=0.5.0",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
